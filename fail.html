<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>결제 실패 · AI 자소서 첨삭 리포트</title>
<meta name="robots" content="noindex" />
<style>
  :root{
    --point: #2F6BFF;
    --point-dark: #1F4FD8;
    --danger: #E5484D;
    --danger-dark: #C1272D;
    --danger-soft: #FEF1F1;
    --text: #17191C;
    --text-sub: #5B6270;
    --line: #E8EAEF;
    --bg-soft: #F7F8FA;
    --radius: 16px;
    --radius-lg: 22px;
    --shadow: 0 2px 10px rgba(23,25,28,.06);
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; background:#fff; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Pretendard", "Noto Sans KR", "맑은 고딕", "Malgun Gothic", sans-serif;
    font-size:16px; line-height:1.7; letter-spacing:-0.01em;
    word-break: keep-all; overflow-wrap: break-word;
  }
  .wrap{ width:100%; max-width:560px; margin:0 auto; padding:0 20px; }
  h1{ font-size:24px; font-weight:800; margin:0; line-height:1.4; letter-spacing:-0.02em; }
  p{ margin:0; }
  .sub{ color: var(--text-sub); font-size:15px; }

  header{ padding:48px 0 24px; text-align:center; }
  .badge{
    display:inline-block; background: var(--danger-soft); color: var(--danger-dark);
    font-size:13px; font-weight:700; padding:6px 12px; border-radius:999px;
    margin-bottom:14px;
  }

  .panel{
    border:1.5px solid var(--danger); border-radius: var(--radius);
    background: var(--danger-soft); padding:22px;
  }
  .reason{ font-size:16px; font-weight:800; color: var(--danger-dark); }
  .detail{ margin-top:14px; }
  .detail .row{
    display:flex; gap:10px; padding:8px 0;
    border-top:1px solid #F3D7D8; font-size:14px;
  }
  .detail .row:first-child{ border-top:0; }
  .detail dt{ flex:0 0 78px; color: var(--danger-dark); opacity:.75; margin:0; }
  .detail dd{ margin:0; font-weight:700; color: var(--danger-dark); word-break:break-all; }

  .help{
    margin-top:16px; border:1px solid var(--line); border-radius: var(--radius);
    padding:18px; background:#fff;
  }
  .help h2{ font-size:15px; font-weight:800; margin:0 0 8px; }
  .help ul{ margin:0; padding-left:18px; font-size:14px; color: var(--text-sub); }
  .help li{ margin-top:5px; }

  .actions{ margin-top:22px; }
  .btn{
    display:block; width:100%; border:0; cursor:pointer;
    background: var(--point); color:#fff;
    font-size:16px; font-weight:800; padding:17px 20px;
    border-radius: var(--radius-lg); box-shadow: var(--shadow);
    text-align:center; text-decoration:none;
  }
  .btn:hover{ background: var(--point-dark); }
  .btn-ghost{
    background:#fff; color: var(--text-sub);
    border:1.5px solid var(--line); box-shadow:none;
    font-size:14px; font-weight:700; padding:13px 20px; margin-top:8px;
  }
  .btn-ghost:hover{ background: var(--bg-soft); color: var(--text); }

  footer{
    border-top:1px solid var(--line); margin-top:40px;
    padding:24px 0 40px; font-size:13px; color:#9AA0AC; text-align:center;
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <span class="badge">결제 실패</span>
    <h1>결제가 완료되지 않았습니다</h1>
    <p class="sub" style="margin-top:8px;">요금은 청구되지 않았습니다.</p>
  </div>
</header>

<main class="wrap">
  <div class="panel">
    <p class="reason" id="reason">결제가 중단되었습니다.</p>
    <dl class="detail" id="detail"></dl>
  </div>

  <div class="help">
    <h2>이런 경우에 자주 발생합니다</h2>
    <ul>
      <li>결제창을 직접 닫은 경우</li>
      <li>카드 한도가 부족하거나 결제가 거절된 경우</li>
      <li>카드 정보를 잘못 입력한 경우</li>
      <li>결제 시간이 초과된 경우</li>
    </ul>
  </div>

  <div class="actions">
    <button class="btn" id="retry">다시 시도하기</button>
    <a class="btn btn-ghost" href="/">첫 화면으로 돌아가기</a>
  </div>
</main>

<footer>
  <div class="wrap">AI 자소서 첨삭 리포트</div>
</footer>

<script>
const params = new URLSearchParams(location.search);
const code = params.get("code");
const message = params.get("message");
const orderId = params.get("orderId");

const reasonBox = document.getElementById("reason");
const detailList = document.getElementById("detail");

// 자주 나오는 코드는 쉬운 말로 바꿔서 보여줍니다.
const FRIENDLY = {
  PAY_PROCESS_CANCELED: "결제를 취소하셨습니다.",
  PAY_PROCESS_ABORTED: "결제 진행 중 문제가 생겨 중단되었습니다.",
  USER_CANCEL: "결제를 취소하셨습니다.",
  REJECT_CARD_COMPANY: "카드사에서 결제를 거절했습니다.",
  INVALID_CARD_EXPIRATION: "카드 유효기간이 올바르지 않습니다.",
  INVALID_STOPPED_CARD: "정지된 카드입니다.",
  EXCEED_MAX_DAILY_PAYMENT_COUNT: "하루 결제 가능 횟수를 초과했습니다.",
  EXCEED_MAX_PAYMENT_AMOUNT: "결제 한도를 초과했습니다.",
  NOT_SUPPORTED_INSTALLMENT_PLAN_CARD_OR_MERCHANT: "할부가 지원되지 않는 카드입니다.",
  INVALID_CARD_NUMBER: "카드번호가 올바르지 않습니다.",
  NOT_AVAILABLE_BANK: "은행 점검 시간입니다. 잠시 뒤에 다시 시도해 주세요.",
};

function addRow(label, value) {
  const row = document.createElement("div");
  row.className = "row";

  const dt = document.createElement("dt");
  dt.textContent = label;
  row.appendChild(dt);

  const dd = document.createElement("dd");
  dd.textContent = value;
  row.appendChild(dd);

  detailList.appendChild(row);
}

if (code && FRIENDLY[code]) {
  reasonBox.textContent = FRIENDLY[code];
} else if (message) {
  reasonBox.textContent = message;
}

if (code) addRow("실패 코드", code);
if (message) addRow("메시지", message);
if (orderId) addRow("주문번호", orderId);

document.getElementById("retry").addEventListener("click", function () {
  // 첫 화면의 결제 영역으로 돌아갑니다.
  location.href = "/#payment-method";
});
</script>

</body>
</html>
